<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>カラージェル管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f7;
  --bg2: #f2efe9;
  --card: #ffffff;
  --text: #1a1715;
  --text2: #6b6560;
  --text3: #a8a29c;
  --border: #e5e0d8;
  --accent: #c4956a;
  --accent2: #e8d5c0;
  --disc: #e85d5d;
  --new: #4caf7d;
  --radius: 12px;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}


/* ===== 写真登録モード ===== */
.reg-mode-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 500; font-family: inherit;
  border: 1px solid var(--border);
  background: var(--bg2); color: var(--text2);
  cursor: pointer; white-space: nowrap; margin-left: 6px;
}
.reg-mode-btn.on { background: #5b8dd9; color: white; border-color: #5b8dd9; }
.reg-overlay-hint {
  display: none;
  background: #1a1715ee; color: white;
  padding: 10px 16px; font-size: 12px; line-height: 1.6;
  text-align: center;
}
.reg-overlay-hint.show { display: block; }
.chart-container.reg-active { cursor: crosshair; }
.chart-container.reg-active .chart-hint { background: #5b8dd9; color: white; }

/* タップ登録ポップアップ */
.tap-popup {
  display: none; position: fixed; z-index: 300;
  background: var(--card); border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  padding: 16px; min-width: 220px;
  border: 1px solid var(--border);
}
.tap-popup.show { display: block; }
.tap-popup-title { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
.tap-popup input {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; color: var(--text);
  background: var(--bg2); margin-bottom: 8px; outline: none;
}
.tap-popup input:focus { border-color: var(--accent); }
.tap-popup-btns { display: flex; gap: 6px; }
.tap-popup-btns button {
  flex: 1; padding: 8px; border-radius: 8px;
  font-size: 12px; font-weight: 500; font-family: inherit;
  border: 1px solid var(--border); cursor: pointer;
}
.tap-popup-btns .confirm { background: var(--text); color: white; border-color: var(--text); }
.tap-popup-btns .cancel { background: var(--bg2); color: var(--text2); }

/* 登録済みピン */
.pin {
  position: absolute;
  width: 22px; height: 22px;
  background: var(--accent);
  border: 2px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; font-weight: 700; color: white;
  cursor: pointer; pointer-events: all;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  white-space: nowrap;
  transition: transform 0.15s;
}
.pin:hover { transform: translate(-50%, -50%) scale(1.2); }
.pin.disc { background: var(--disc); }
.pin.new { background: var(--new); }

/* ===== TOP BAR ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-brand svg { width: 22px; height: 22px; opacity: 0.7; }
.topbar-title { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; color: var(--text); }
.topbar-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
/* pc-badge removed */

/* ===== STATS ===== */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--border);
  border-bottom: 1px solid var(--border);
}
.stat {
  background: var(--card);
  padding: 12px 8px; text-align: center;
}
.stat-n { font-size: 20px; font-weight: 700; }
.stat-l { font-size: 10px; color: var(--text3); margin-top: 2px; letter-spacing: 0.05em; }
.stat-n.green { color: var(--new); }
.stat-n.red { color: var(--disc); }
.stat-n.blue { color: #5b8dd9; }

/* ===== TABS ===== */
.tabs {
  display: flex; overflow-x: auto; scrollbar-width: none;
  padding: 10px 16px 0; gap: 4px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  overscroll-behavior-x: contain;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 7px 16px 9px;
  font-size: 12px; font-weight: 500;
  color: var(--text3);
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  position: relative; bottom: -1px;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ===== SEARCH ===== */
.search-wrap {
  padding: 12px 16px 8px;
  background: var(--bg);
}
.search-inner {
  position: relative;
}
.search-inner svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; opacity: 0.4; pointer-events: none;
}
.search-inner input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  border: 1px solid var(--border);
  border-radius: 50px;
  background: var(--card);
  font-size: 13px; font-family: inherit;
  color: var(--text);
  outline: none;
}
.search-inner input:focus { border-color: var(--accent); }

/* ===== VIEW TOGGLE (PC) ===== */
.view-toggle {
  display: flex;
  padding: 0 16px 8px;
  gap: 8px;
}
.vtab {
  padding: 6px 16px; border-radius: 50px;
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--border);
  background: var(--card); color: var(--text2);
  cursor: pointer;
}
.vtab.active { background: var(--text); color: white; border-color: var(--text); }

/* ===== CHART VIEW ===== */
#chart-view { display: block; padding: 16px; }
.chart-container {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--card);
}
.chart-img {
  width: 100%; display: block; cursor: crosshair;
  transition: transform 0.3s ease, transform-origin 0.3s ease;
}
.chart-img.zoomed { cursor: zoom-out; }
.chart-hint {
  text-align: center; padding: 10px;
  font-size: 11px; color: var(--text3);
  background: var(--card);
  border-top: 1px solid var(--border);
}

/* number overlay buttons */
.chart-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.num-btn {
  position: absolute;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid white;
  font-size: 9px; font-weight: 700;
  color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  background: rgba(0,0,0,0.35);
  cursor: pointer; pointer-events: all;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
  transition: transform 0.15s, background 0.15s;
  line-height: 1;
  padding: 0;
}
.num-btn:active { transform: translate(-50%, -50%) scale(1.2); background: rgba(196,149,106,0.8); }
.num-btn.disc { background: rgba(232,93,93,0.7); border-color: #ffaaaa; }
.num-btn.new { background: rgba(76,175,125,0.7); border-color: #aaffcc; }

/* ===== GRID VIEW ===== */
#grid-view { display: none; }
/* color-grid moved to cell css block */
.color-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 0 16px 16px;
  background: var(--bg);
}
@media (min-width: 480px) { .color-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px) { .color-grid { grid-template-columns: repeat(4, 1fr); } }
.color-cell {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 12px 10px 10px;
  display: flex; flex-direction: row; align-items: center; gap: 10px;
  cursor: pointer; position: relative;
  transition: box-shadow 0.15s, transform 0.1s;
}
.color-cell:active { transform: scale(0.98); box-shadow: none; }
.color-cell:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.cell-swatch {
  width: 44px; height: 58px; flex-shrink: 0;
  border-radius: 48% 48% 42% 42% / 55% 55% 45% 45%;
  border: 1px solid rgba(0,0,0,0.08);
}
.cell-info { flex: 1; min-width: 0; }
.cell-num {
  font-size: 13px; font-weight: 600;
  color: var(--text); line-height: 1.2;
}
.cell-tex {
  font-size: 10px; color: var(--text3);
  margin-top: 2px; line-height: 1.3;
}
.cell-desc {
  font-size: 11px; color: var(--text2);
  margin-top: 3px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.cell-stars { font-size: 9px; color: var(--text3); margin-top: 3px; }
.cell-badge {
  position: absolute; top: 6px; right: 6px;
  padding: 2px 7px; border-radius: 10px;
  font-size: 9px; font-weight: 700;
  color: white;
}
.cell-badge.disc { background: var(--disc); }
.cell-badge.new { background: var(--new); }

/* ===== BOTTOM SHEET / MODAL ===== */
.sheet-bg {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.45);
  align-items: flex-end;
}
.sheet-bg.open { display: flex; }
.sheet {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  width: 100%; max-height: 92vh;
  overflow-y: auto;
  padding: 0 0 env(safe-area-inset-bottom, 16px);
  animation: slideUp 0.28s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border);
  margin: 12px auto 0;
}
.sheet-photo-wrap {
  width: 100%;
  height: 220px;
  overflow: hidden;
  position: relative;
  background: var(--bg2);
}
.sheet-photo-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  object-position: center center;
}
.sheet-photo-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.5) 100%);
}
.sheet-photo-num {
  position: absolute; bottom: 14px; left: 16px;
  font-size: 28px; font-weight: 700;
  color: white; letter-spacing: -0.01em;
}
.sheet-photo-status {
  position: absolute; top: 12px; right: 12px;
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
  color: white; letter-spacing: 0.05em;
}
.sheet-photo-status.active { background: var(--new); }
.sheet-photo-status.disc { background: var(--disc); }
.sheet-photo-status.new { background: #5b8dd9; }

/* swatch fallback when no photo */
.sheet-swatch-hero {
  width: 80px; height: 100px;
  border-radius: 50% 50% 40% 40% / 38% 38% 50% 50%;
  margin: 20px auto 0;
  border: 1px solid rgba(0,0,0,0.1);
  display: none;
}

.sheet-body { padding: 16px 20px; }
.sheet-tex-row { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
.sheet-desc { font-size: 14px; color: var(--text2); line-height: 1.7; }

.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin: 14px 0;
}
.detail-cell {
  background: var(--bg2);
  border-radius: 10px;
  padding: 10px 12px;
}
.detail-cell-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.05em; }
.detail-cell-val { font-size: 13px; font-weight: 500; color: var(--text); }

/* ===== PC ADMIN PANEL ===== */
.admin-panel {
  display: none;
  margin: 16px 0 0;
  padding: 16px;
  background: #fff8f4;
  border: 1px solid #ecd5c0;
  border-radius: var(--radius);
}
.app-layout.admin-mode .admin-panel { display: block; }
.admin-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.admin-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.admin-btn {
  padding: 9px 18px; border-radius: 50px;
  font-size: 13px; font-weight: 500; font-family: inherit;
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.15s;
}
.admin-btn.danger { background: #fef0f0; color: var(--disc); border-color: #f8c8c8; }
.admin-btn.danger:hover { background: var(--disc); color: white; }
.admin-btn.success { background: #f0faf5; color: var(--new); border-color: #b8e8cc; }
.admin-btn.success:hover { background: var(--new); color: white; }
.admin-btn.neutral { background: var(--card); color: var(--text2); }
.admin-btn.neutral:hover { background: var(--bg2); }

/* ===== PC ADD FORM ===== */
.add-form-wrap {
  display: none;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  margin-top: 16px;
}
.app-layout.admin-mode .add-form-wrap { display: block; }
.add-form-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
.add-form {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.add-form input, .add-form select {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px; font-family: inherit;
  background: var(--card); color: var(--text);
  outline: none;
}
.add-form input:focus, .add-form select:focus { border-color: var(--accent); }
.add-form input[type=color] { padding: 3px; height: 38px; cursor: pointer; }
.add-form .full { grid-column: 1/-1; }
.add-form .submit-btn {
  grid-column: 1/-1;
  padding: 11px;
  background: var(--text); color: white;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: opacity 0.15s;
}
.add-form .submit-btn:hover { opacity: 0.8; }

/* ===== SHEET CLOSE BTN ===== */
.sheet-close {
  display: block; width: calc(100% - 40px);
  margin: 8px 20px 16px;
  padding: 13px;
  background: var(--bg2); color: var(--text2);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 14px; font-family: inherit;
  cursor: pointer; text-align: center;
}

/* ===== EMPTY STATE ===== */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }

/* ===== PHOTO UPLOAD PROMPT ===== */
.photo-prompt {
  margin: 16px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  background: var(--card);
}
.photo-prompt p { font-size: 13px; color: var(--text3); line-height: 1.7; }
.photo-prompt input { display: none; }
.photo-prompt label {
  display: inline-block; margin-top: 14px;
  padding: 10px 24px;
  background: var(--text); color: white;
  border-radius: 50px; font-size: 13px; font-weight: 500;
  cursor: pointer;
}

/* ===== ADMIN MODE LAYOUT (JS制御) ===== */
.app-layout { display: block; }
.app-layout.admin-mode { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 60px); }
.app-layout.admin-mode .left-panel { border-right: 1px solid var(--border); overflow-y: auto; max-height: calc(100vh - 120px); }
.app-layout.admin-mode .right-panel { padding: 24px; overflow-y: auto; display: block !important; }
.app-layout.admin-mode .right-panel-inner { max-width: 640px; }
.app-layout.admin-mode #chart-view { padding: 0; }
.app-layout.admin-mode .chart-container { border-radius: 0; border: none; border-bottom: 1px solid var(--border); }
.app-layout.admin-mode .sheet-bg { display: none !important; }

/* PC detail panel */
.pc-detail { display: none; }
.app-layout.admin-mode .pc-detail { display: block; }

/* 管理ボタン */
.admin-toggle-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 500; font-family: inherit;
  border: 1px solid var(--border);
  background: var(--bg2); color: var(--text2);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.admin-toggle-btn.on { background: var(--accent); color: white; border-color: var(--accent); }

.pc-detail-inner {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
/* 写真は使わず、色のヘッダーバナーとネイルチップを表示 */
.pc-detail-banner {
  width: 100%; height: 180px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.pc-detail-nail {
  width: 80px; height: 104px;
  border-radius: 50% 50% 40% 40% / 38% 38% 50% 50%;
  border: 2px solid rgba(255,255,255,0.5);
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.pc-detail-swatch-hero {
  display: none; /* 旧スタイル非表示 */
}
.pc-detail-body { padding: 20px; }
.pc-detail-num { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
.pc-detail-tex { font-size: 13px; color: var(--text3); margin-bottom: 10px; }
.pc-detail-desc { font-size: 14px; color: var(--text2); line-height: 1.8; }
.pc-detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin: 16px 0;
}

.pc-placeholder {
  text-align: center; padding: 60px 20px;
  color: var(--text3);
}
.pc-placeholder svg { width: 48px; height: 48px; opacity: 0.2; margin-bottom: 16px; }
.pc-placeholder p { font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
    <div>
      <div class="topbar-title">カラージェル管理</div>
      <div class="topbar-sub" id="topbar-sub">読み込み中...</div>
    </div>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="reg-mode-btn" id="reg-mode-btn" onclick="toggleRegMode()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M3 9a9 9 0 0 1 18 0v6a9 9 0 0 1-18 0V9z"/></svg>
      写真登録
    </button>
    <button class="admin-toggle-btn" id="admin-toggle-btn" onclick="toggleAdminMode()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      管理
    </button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="s-total">—</div><div class="stat-l">総数</div></div>
  <div class="stat"><div class="stat-n green" id="s-active">—</div><div class="stat-l">在庫</div></div>
  <div class="stat"><div class="stat-n red" id="s-disc">—</div><div class="stat-l">廃番</div></div>
  <div class="stat"><div class="stat-n blue" id="s-new">—</div><div class="stat-l">新色</div></div>
</div>

<div class="app-layout">
<!-- LEFT / MOBILE MAIN -->
<div class="left-panel" id="left-panel">

  <div class="tabs" id="tabs"></div>

  <div class="search-wrap">
    <div class="search-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="番号・色名・素材で検索..." />
    </div>
  </div>

  <div class="view-toggle" id="view-toggle">
    <button class="vtab active" onclick="switchView('chart')">チャート写真</button>
    <button class="vtab" onclick="switchView('grid')">グリッド</button>
  </div>

  <!-- CHART VIEW -->
  <div id="chart-view">
    <div id="photo-prompt-wrap" class="photo-prompt">
      <p style="font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px">📷 カラーチャート写真</p>
      <p>写真をアップすると一覧で表示されます<br><span style="font-size:11px;color:var(--text3)">番号の登録は「一括登録」からできます</span></p>
      <input type="file" accept="image/*" id="chart-upload" onchange="loadChartPhoto(event)">
      <label for="chart-upload">写真を選ぶ</label>
      <div style="margin-top:10px;font-size:11px;color:var(--text3)">または</div>

    </div>

        <span>タップでズーム・番号で詳細</span>
        <button onclick="showManualImportUI()" style="font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.15);background:rgba(255,255,255,0.9);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500">📋 一括登録</button>
      </div>
    </div>
  </div>

  <!-- GRID VIEW -->
  <div id="grid-view">
    <div id="color-grid"></div>
  </div>

  <!-- PC ADD FORM -->
  <div class="add-form-wrap">
    <div class="add-form-title">新色を追加</div>
    <div class="add-form">
      <input type="text" id="a-num" placeholder="番号 (例: 140)">
      <input type="color" id="a-color" value="#F9D0D8">
      <input type="text" id="a-tex" placeholder="素材 (例: マット)" class="full">
      <input type="text" id="a-desc" placeholder="特徴・メモ" class="full">

</div><!-- /left-panel -->

          </div>

          <div class="pc-detail-desc" id="pc-desc"></div>
          <div class="pc-detail-grid" id="pc-detail-grid"></div>
          <div class="admin-panel" id="pc-admin">

            <div class="admin-btns" id="pc-admin-btns"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div><!-- /app-layout -->

let data = [];

const TABS = ["すべて","ピンク系","レッド/オレンジ系","イエロー/グリーン系","ブルー/パープル系","ベージュ/ホワイト系","グレー/ブラック系","グリッター/ラメ系","廃番","新色"];

function tabFilter(c, tab) {
  const n = parseInt(c.n) || 0;
  if (tab === "すべて") return true;
  if (tab === "廃番") return c.status === "disc";
  if (tab === "新色") return c.status === "new";
  if (tab === "グリッター/ラメ系") return c.tex.includes("グリッター") || c.tex.includes("ラメ") || c.tex.includes("ホロ") || c.tex.includes("チラ") || c.id.startsWith("L") || c.id.startsWith("FL");
  if (tab === "ピンク系") return (n>=1&&n<=20)||(n===104)||(n===119)||(n===123)||(n===124)||(n===126)||(n===130);
  if (tab === "レッド/オレンジ系") return (n>=21&&n<=27)||(n===58)||(n===64)||(n===90)||(n===113)||(n===131)||(n===107);
  if (tab === "イエロー/グリーン系") return (n>=28&&n<=37)||(n===79)||(n===88)||(n===89)||(n===99)||(n===120)||(n===121);
  if (tab === "ブルー/パープル系") return (n>=38&&n<=50)||(n===84)||(n===85)||(n===86)||(n===96)||(n===100)||(n===101)||(n===106)||(n===110)||(n===115)||(n===116)||(n===127)||(n===128)||(n===138);
  if (tab === "ベージュ/ホワイト系") return (n>=55&&n<=75)||(n>=92&&n<=98)||(n===103)||(n===109)||(n===112)||(n===118)||(n===125)||(n===129)||(n===133)||(n===134)||(n===137);
  if (tab === "グレー/ブラック系") return (n===51)||(n===52)||(n===53)||(n===54)||(n===70)||(n===78)||(n===95)||(n===102)||(n===122)||(n===139);
  return true;
}

// ============================
// STORAGE (shared via window.storage API)
// ============================
async function saveData() {
  try {
    await window.storage.set('nail_colors_v3', JSON.stringify(data));
    if (chartPhotoSrc) await window.storage.set('nail_chart_photo', chartPhotoSrc);
    await window.storage.set('nail_chart_pins', JSON.stringify(chartPins));
  } catch(e) {
    try {
      localStorage.setItem('nail_colors_v3', JSON.stringify(data));
      localStorage.setItem('nail_chart_pins', JSON.stringify(chartPins));
    } catch(e2){}
  }
}

async function loadData() {
  try {
    const r = await window.storage.get('nail_colors_v3');
    if (r && r.value) { data = JSON.parse(r.value); }
    else { data = DEFAULT_COLORS.map(c=>({...c})); }
    const pr = await window.storage.get('nail_chart_photo');
    if (pr && pr.value) { chartPhotoSrc = pr.value; showChartPhoto(); }
    const pinr = await window.storage.get('nail_chart_pins');
    if (pinr && pinr.value) { chartPins = JSON.parse(pinr.value); }
  } catch(e) {
    try {
      const s = localStorage.getItem('nail_colors_v3');
      data = s ? JSON.parse(s) : DEFAULT_COLORS.map(c=>({...c}));
      const sp = localStorage.getItem('nail_chart_pins');
      if (sp) chartPins = JSON.parse(sp);
    } catch(e2) { data = DEFAULT_COLORS.map(c=>({...c})); }
  }
  init();
}

// ============================
function switchView(v) {
  currentView = v;
  document.getElementById('chart-view').style.display = v==='chart' ? 'block' : 'none';
  document.getElementById('grid-view').style.display = v==='grid' ? 'block' : 'none';
  document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('active', b.textContent.includes(v==='chart'?'チャート':'グリッド')));
}

// ============================
// GRID
// ============================
function getFiltered() {
  const q = searchQ.trim().toLowerCase();
  return data.filter(c => {
    const mq = !q || c.n.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.tex.toLowerCase().includes(q);
    return mq && tabFilter(c, activeTab);
  });
}

function renderGrid() {
  const el = document.getElementById('color-grid');
  const items = getFiltered();
  if (!items.length) { el.innerHTML = '<div class="empty" style="grid-column:1/-1">該当なし</div>'; return; }
  el.innerHTML = items.map(c => {
    const stars = '★'.repeat(c.stars||2) + '☆'.repeat(4-(c.stars||2));
    const badgeLabel = c.status==='disc' ? '廃番' : c.status==='new' ? '新色' : '';
    return `
    <div class="color-cell" onclick="selectColor('${c.id}')">
      <div class="cell-swatch" style="background:${c.c}"></div>
      <div class="cell-info">
        <div class="cell-num">No.${c.n}</div>
        <div class="cell-tex">${c.tex}</div>
        <div class="cell-desc">${c.desc}</div>
        <div class="cell-stars">${stars}</div>
      </div>
      ${badgeLabel ? `<div class="cell-badge ${c.status}">${badgeLabel}</div>` : ''}
    </div>`;
  }).join('');
}

  document.getElementById('s-total').textContent = data.length;
  document.getElementById('s-active').textContent = data.filter(c=>c.status==='active').length;
  document.getElementById('s-disc').textContent = data.filter(c=>c.status==='disc').length;
  document.getElementById('s-new').textContent = data.filter(c=>c.status==='new').length;
  document.getElementById('topbar-sub').textContent = `全${data.length}色`;
}

// CHART PHOTO
// ============================
function loadChartPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    chartPhotoSrc = e.target.result;
    showChartPhoto();
    saveData();
  };
  reader.readAsDataURL(file);
}


function applyAnalysisResult(chips) {
  let added = 0, updated = 0;
  chips.forEach(chip => {
    const existing = data.find(c => c.n === chip.n);
    if (existing) {
      existing.c = chip.hex || existing.c;
      if (chip.tex) existing.tex = chip.tex;
      updated++;
    } else {
      data.push({ id: chip.n, n: chip.n, c: chip.hex || '#E0D0C8',
        tex: chip.tex || 'マット', desc: `No.${chip.n}`,
        status: 'active', stars: 2, cure: '△' });
      added++;
    }
  });
  saveData(); renderGrid(); updateStats();
  showAnalysisStatus(`✅ ${chips.length}色を検出（${added}件追加・${updated}件更新）`, 'done');
  setTimeout(() => hideAnalysisStatus(), 5000);
}

function importFromList() {
  const raw = document.getElementById('import-numbers')?.value || '';
  const nums = raw.split(/[,、
\s]+/).map(s => s.trim()).filter(Boolean);
  if (!nums.length) { alert('番号を入力してください'); return; }
  let added = 0;
  nums.forEach(n => {
    if (!data.find(c => c.n === n)) {
      // DEFAULT_COLORSから既存データがあれば使う
      const def = DEFAULT_COLORS.find(c => c.n === n);
      if (def) { data.push({...def}); }
      else { data.push({ id: n, n, c: '#E8D0C8', tex: 'マット', desc: `No.${n}`, status: 'active', stars: 2, cure: '△' }); }
      added++;
    }
  });
  saveData(); renderGrid(); updateStats();
  document.getElementById('manual-import-panel').style.display = 'none';
  showAnalysisStatus(`✅ ${added}色を追加しました`, 'done');
  setTimeout(() => hideAnalysisStatus(), 4000);
}

function showAnalysisStatus(msg, type) {
  let bar = document.getElementById('analysis-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'analysis-bar';
    bar.style.cssText = `
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      padding:12px 20px; border-radius:12px; font-size:13px; font-weight:500;
      z-index:500; max-width:90vw; text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.2); transition:all 0.3s;
    `;
    document.body.appendChild(bar);
  }
  bar.textContent = msg;
  bar.style.display = 'block';
  if (type === 'loading') { bar.style.background = '#1a1715'; bar.style.color = 'white'; }
  else if (type === 'done') { bar.style.background = '#4caf7d'; bar.style.color = 'white'; }
  else if (type === 'error') { bar.style.background = '#e85d5d'; bar.style.color = 'white'; }
}

function hideAnalysisStatus() {
  const bar = document.getElementById('analysis-bar');
  if (bar) bar.style.display = 'none';
}

function showChartPhoto() {
  document.getElementById('photo-prompt-wrap').style.display = 'none';
  const container = document.getElementById('chart-container');
  container.style.display = 'block';
  const img = document.getElementById('chart-img');

  } else {
    btn.classList.remove('on');
    container.classList.remove('reg-active');
    hint.textContent = 'タップでズーム / 番号ボタンで詳細';
    cancelPin();
  }
}

function handleChartTap(e) {
  if (!regMode) { toggleZoom(e); return; }
  // タップ位置を%で保存
  const img = document.getElementById('chart-img');
  const rect = img.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width * 100);
  const yPct = ((e.clientY - rect.top) / rect.height * 100);
  pendingPin = { x: xPct, y: yPct };
  // ポップアップを表示
  const popup = document.getElementById('tap-popup');
  popup.classList.add('show');
  // 画面端に出ないよう位置調整
  const px = Math.min(e.clientX, window.innerWidth - 240);
  const py = Math.min(e.clientY + 12, window.innerHeight - 130);
  popup.style.left = px + 'px';
  popup.style.top = py + 'px';
  popup.style.position = 'fixed';
  const input = document.getElementById('tap-num-input');
  input.value = '';
  setTimeout(() => input.focus(), 100);
}

document.getElementById('tap-num-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmPin();
  if (e.key === 'Escape') cancelPin();
});

function confirmPin() {
  const num = document.getElementById('tap-num-input').value.trim();
  if (!num || !pendingPin) { cancelPin(); return; }
  // カラーIDを探す（番号で検索）
  const color = data.find(c => c.n === num);
  if (!color) {
    alert(`No.${num} はデータにありません。先に新色として追加してください。`);
    return;
  }
  chartPins[color.id] = { x: pendingPin.x, y: pendingPin.y };
  saveData();
  cancelPin();
  renderPins();
}

function cancelPin() {
  pendingPin = null;
  document.getElementById('tap-popup').classList.remove('show');
}

function renderPins() {
  const overlay = document.getElementById('chart-overlay');
  if (!overlay) return;
  overlay.innerHTML = '';
  Object.entries(chartPins).forEach(([id, pos]) => {
    const color = data.find(c => c.id === id);
    if (!color) return;
    const pin = document.createElement('div');
    pin.className = 'pin' + (color.status === 'disc' ? ' disc' : color.status === 'new' ? ' new' : '');
    pin.style.left = pos.x + '%';
    pin.style.top = pos.y + '%';
    pin.textContent = color.n;
    pin.title = `No.${color.n}: ${color.desc}`;
    pin.onclick = (e) => {
      e.stopPropagation();
      if (regMode) {
        // 登録済みピンを削除
        if (confirm(`No.${color.n} の位置登録を削除しますか？`)) {
          delete chartPins[id];
          saveData();
          renderPins();
        }
      } else {
        selectColor(id);
      }
    };
    overlay.appendChild(pin);
  });
}

let zoomed = false;
let zoomX = 50, zoomY = 50;
function toggleZoom(e) {
  const img = document.getElementById('chart-img');
  if (zoomed) {
    img.style.transform = '';
    img.style.transformOrigin = '';
    img.classList.remove('zoomed');
    zoomed = false;
  } else {
    const rect = img.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = 'scale(3)';
    img.classList.add('zoomed');
    zoomed = true;
  }
}

// ============================
// SELECT COLOR
// ============================
function selectColor(id) {
  selectedId = id;
  const c = data.find(x => x.id === id);
  if (!c) return;

  if (window.innerWidth >= 768) {
    showPCDetail(c);
  } else {
    showSheet(c);
  }
}

function detailGridHTML(c) {
  const stars = '★'.repeat(c.stars||2) + '☆'.repeat(4-(c.stars||2));
  return `
    <div class="detail-cell"><div class="detail-cell-label">テクスチャー</div><div class="detail-cell-val">${stars}</div></div>
    <div class="detail-cell"><div class="detail-cell-label">素材</div><div class="detail-cell-val">${c.tex}</div></div>
    <div class="detail-cell"><div class="detail-cell-label">硬化不良リスク</div><div class="detail-cell-val">${c.cure||'—'}</div></div>
    <div class="detail-cell"><div class="detail-cell-label">ステータス</div><div class="detail-cell-val" style="color:${c.status==='disc'?'var(--disc)':c.status==='new'?'#5b8dd9':'var(--new)'}">${c.status==='disc'?'廃番':c.status==='new'?'新色':'在庫あり'}</div></div>
  `;
}

// ============================
// MOBILE SHEET
// ============================
function showSheet(c) {
  // カラーバナー：①chartPins位置ズーム ②CHIP_PHOTOS ③色バナー の順で優先
  const wrap = document.getElementById('sh-photo-wrap');
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.justifyContent = 'center';
  wrap.style.overflow = 'hidden';
  wrap.style.position = 'relative';
  document.getElementById('sh-photo').style.display = 'none';
  document.getElementById('sh-overlay').style.display = 'none';
  const sw = document.getElementById('sh-swatch-hero');
  // 古い要素を削除
  ['sh-chip-img','sh-zoom-wrap','sh-zoom-label'].forEach(id => { const el=document.getElementById(id); if(el) el.remove(); });

  const pin = chartPins[c.id];
  const chipSrcM = CHIP_PHOTOS[c.id] || null;

  if (pin && chartPhotoSrc) {
    // チャート写真をズーム表示（ピン位置を中央に）
    wrap.style.height = '220px';
    wrap.style.background = '#1a1715';
    sw.style.display = 'none';
    const zw = document.createElement('div');
    zw.id = 'sh-zoom-wrap';
    zw.style.cssText = 'position:absolute;inset:0;overflow:hidden';
    const zimg = document.createElement('img');
    zimg.src = chartPhotoSrc;
    zimg.style.cssText = `position:absolute;width:350%;height:auto;transform-origin:${pin.x}% ${pin.y}%;left:${50-pin.x*3.5}%;top:${-(pin.y/100)*3.5*220+110}px;pointer-events:none`;
    zw.appendChild(zimg);
    wrap.appendChild(zw);
    const lbl = document.createElement('div');
    lbl.id = 'sh-zoom-label';
    lbl.style.cssText = 'position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.55);color:white;font-size:10px;padding:3px 8px;border-radius:8px;z-index:2';
    lbl.textContent = 'チャートより';
    wrap.appendChild(lbl);
  } else if (chipSrcM) {
    wrap.style.height = '240px';
    wrap.style.background = '#f0ece8';
    sw.style.display = 'none';
    const chipImg = document.createElement('img');
    chipImg.id = 'sh-chip-img';
    chipImg.src = chipSrcM;
    chipImg.style.cssText = 'height:210px;width:auto;border-radius:48% 48% 42% 42%/55% 55% 45% 45%;box-shadow:0 8px 28px rgba(0,0,0,0.18);object-fit:cover;display:block';
    wrap.appendChild(chipImg);
  } else {
    const old2 = document.getElementById('sh-chip-img');
    if (old2) old2.remove();
    wrap.style.height = '180px';
    wrap.style.background = c.c;
    sw.style.cssText = `display:block;background:${adjustColor(c.c,-18)};width:64px;height:84px;border-radius:50% 50% 40% 40% / 38% 38% 50% 50%;border:2px solid rgba(255,255,255,0.5);box-shadow:0 6px 24px rgba(0,0,0,0.18)`;
  }
  document.getElementById('sh-num').textContent = 'No.' + c.n;
  const sb = document.getElementById('sh-status');
  sb.textContent = c.status==='disc'?'廃番':c.status==='new'?'新色':'在庫あり';
  sb.className = 'sheet-photo-status ' + c.status;
  document.getElementById('sh-tex').textContent = c.tex;
  document.getElementById('sh-desc').textContent = c.desc;
  document.getElementById('sh-detail-grid').innerHTML = detailGridHTML(c);

  // admin (hidden on mobile by default — show if desired)
  document.getElementById('sh-admin').style.display = 'none';

  document.getElementById('sheet-bg').classList.add('open');
}

function closeSheet() { document.getElementById('sheet-bg').classList.remove('open'); }
function maybeCloseSheet(e) { if (e.target.id==='sheet-bg') closeSheet(); }

// ============================
// PC DETAIL
// ============================
function showPCDetail(c) {
  document.getElementById('pc-placeholder').style.display = 'none';
  const cont = document.getElementById('pc-detail-content');
  cont.style.display = 'block';

  // カラーバナー：実写があれば<img>、なければ色
  const banner = document.getElementById('pc-banner');
  const nail = document.getElementById('pc-nail');
  const oldCI = document.getElementById('pc-chip-img');
  if (oldCI) oldCI.remove();
  const chipSrc = CHIP_PHOTOS[c.id] || null;
  if (chipSrc) {
    banner.style.background = '#f0ece8';
    nail.style.display = 'none';
    const ci = document.createElement('img');
    ci.id = 'pc-chip-img';
    ci.src = chipSrc;
    ci.style.cssText = 'height:160px;width:auto;border-radius:48% 48% 42% 42%/55% 55% 45% 45%;box-shadow:0 8px 28px rgba(0,0,0,0.18);object-fit:cover';
    banner.appendChild(ci);
  } else {
    nail.style.display = 'flex';
    banner.style.background = c.c;
    nail.style.background = adjustColor(c.c, -18);
  }

  document.getElementById('pc-num').textContent = 'No.' + c.n;
  document.getElementById('pc-tex').textContent = c.tex;
  document.getElementById('pc-desc').textContent = c.desc;
  document.getElementById('pc-detail-grid').innerHTML = detailGridHTML(c);

  const badge = document.getElementById('pc-badge');
  badge.textContent = c.status==='disc'?'廃番':c.status==='new'?'新色':'在庫あり';
  badge.style.background = c.status==='disc'?'var(--disc)':c.status==='new'?'#5b8dd9':'var(--new)';

  // admin buttons
  const btns = document.getElementById('pc-admin-btns');
  if (c.status === 'disc') {
    btns.innerHTML = `
      <button class="admin-btn success" onclick="setStatus('active')">在庫に戻す</button>
      <button class="admin-btn danger" onclick="deleteColor()">完全削除</button>
    `;
  } else if (c.status === 'new') {
    btns.innerHTML = `
      <button class="admin-btn neutral" onclick="setStatus('active')">通常在庫にする</button>
      <button class="admin-btn danger" onclick="setStatus('disc')">廃番にする</button>
    `;
  } else {
    btns.innerHTML = `
      <button class="admin-btn danger" onclick="setStatus('disc')">廃番にする</button>
    `;
  }
}

// ============================
// ACTIONS
// ============================
function setStatus(s) {
  const c = data.find(x => x.id === selectedId);
  if (!c) return;
  c.status = s;
  saveData(); renderGrid(); updateStats();
  showPCDetail(c);
}

function deleteColor() {
  if (!confirm('このカラーを完全に削除しますか？')) return;
  data = data.filter(x => x.id !== selectedId);
  saveData(); renderGrid(); updateStats();
  document.getElementById('pc-detail-content').style.display = 'none';
  document.getElementById('pc-placeholder').style.display = 'block';
  selectedId = null;
}

function addColor() {
  const num = document.getElementById('a-num').value.trim();
  const col = document.getElementById('a-color').value;
  const tex = document.getElementById('a-tex').value.trim() || 'マット';
  const desc = document.getElementById('a-desc').value.trim() || '新色';
  if (!num) { alert('番号を入力してください'); return; }
  if (data.find(c => c.id === num)) { alert('その番号はすでに存在します'); return; }
  data.push({ id:num, n:num, c:col, tex, desc, status:'new', stars:2, cure:'△' });
  saveData(); renderGrid(); updateStats();
  document.getElementById('a-num').value = '';
  document.getElementById('a-tex').value = '';
  document.getElementById('a-desc').value = '';
}

// ============================
// HELPERS
// ============================
function adjustColor(hex, amount) {
  // 少し暗くしてネイルチップに立体感を出す
  const h = hex.replace('#','');
  const num = parseInt(h.length===3 ? h.split('').map(x=>x+x).join('') : h, 16);
  const r = Math.min(255, Math.max(0, (num>>16) + amount));
  const g = Math.min(255, Math.max(0, ((num>>8)&0xff) + amount));
  const b = Math.min(255, Math.max(0, (num&0xff) + amount));
  return `rgb(${r},${g},${b})`;
}
